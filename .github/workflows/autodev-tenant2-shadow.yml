name: AutoDev Tenant 2 Baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autodev-tenant2-baseline-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  tenant-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tenant candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 32
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run current required tenant checks
        run: npm test && npm run build

      - name: Measure pre-existing lint debt
        continue-on-error: true
        run: npm run lint

      - name: Validate AutoDev declaration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, access } from 'node:fs/promises'
          const manifest = JSON.parse(await readFile('.autodev/project.json', 'utf8'))
          if (manifest.project?.id !== 'festplan') throw new Error('Unexpected tenant project id')
          if (manifest.project?.repository !== 'LPStruiksma/festplan') throw new Error('Unexpected tenant repository')
          if (manifest.authority?.autonomyMode !== 'auto-merge-low-risk') throw new Error('Tenant declaration must be auto-merge-low-risk')
          if (JSON.stringify(manifest.promotion?.autoMergeCategories) !== JSON.stringify(['routine'])) throw new Error('Only the routine auto-merge category is allowed')
          if (manifest.promotion?.requireChecks !== true || manifest.promotion?.requireIndependentReview !== true) throw new Error('Merges must require checks and independent review')
          if (manifest.promotion?.allowDirectProtectedBranchWrite !== false) throw new Error('Direct protected-branch writes are not allowed')
          const humanMerge = manifest.promotion?.humanMergePaths ?? []
          for (const path of ['.github/**', '.autodev/**', 'vercel.json', 'supabase/migrations/**']) {
            if (!humanMerge.includes(path)) throw new Error('Human-merge path missing: ' + path)
          }
          const lockPresent = await access('.autodev/autodev.lock.json').then(() => true, () => false)
          if (lockPresent) throw new Error('The retired shadow lock must stay deleted')
          console.log('FestPlan tenant declaration is auto-merge-low-risk with workflows, .autodev, vercel.json and migrations human-merge.')
          NODE
